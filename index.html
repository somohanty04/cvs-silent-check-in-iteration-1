<script type="text/x-screen" data-id="02-SkipCounter">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: {} };
  }
  renderVals() {
    var labels = ['Deaf / Hard of hearing', 'Non-verbal', 'Language barrier', 'Prefer not to speak'];
    var self = this;
    var base = 'min-height: 44px; padding: 11px 16px; border-radius: 22px; font-size: 16px; line-height: 20px; font-weight: 500; cursor: pointer; ';
    return {
      chips: labels.map(function (label, i) {
        var on = !!self.state.picked[i];
        return {
          label: label,
          style: base + (on
            ? 'background: #FFFFFF; color: #004D99; border: 2px solid #FFFFFF;'
            : 'background: transparent; color: #FFFFFF; border: 1px solid #B4CAE1;'),
          pick: function () {
            var next = Object.assign({}, self.state.picked);
            next[i] = !next[i];
            self.setState({ picked: next });
          }
        };
      })
    };
  }
}
</script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { qty: [1, 1, 1] };
  }
  renderVals() {
    var self = this;
    var data = [
      { name: 'CVS Health Vitamin D3 2000 IU', was: 10.49, unit: 8.49, onSale: true },
      { name: "Nature's Bounty Fish Oil 1400mg", was: 21.99, unit: 17.99, onSale: true },
      { name: 'Life Savers Wint-O-Green Mints', was: 3.89, unit: 3.89, onSale: false }
    ];
    var full = 0;
    var saved = 0;
    var lines = data.map(function (d, i) {
      var q = self.state.qty[i];
      full = full + d.was * q;
      saved = saved + (d.was - d.unit) * q;
      return {
        name: d.name,
        price: '$' + d.unit.toFixed(2),
        wasPrice: '$' + d.was.toFixed(2),
        onSale: d.onSale,
        priceColor: d.onSale ? '#8A5A00' : '#1A1A19',
        qty: q,
        inc: function () {
          var next = self.state.qty.slice();
          next[i] = next[i] + 1;
          self.setState({ qty: next });
        },
        dec: function () {
          var next = self.state.qty.slice();
          next[i] = next[i] > 1 ? next[i] - 1 : 1;
          self.setState({ qty: next });
        }
      };
    });
    return {
      lines: lines,
      subtotal: '$' + full.toFixed(2),
      savings: '−$' + saved.toFixed(2),
      total: '$' + (full - saved + 10).toFixed(2)
    };
  }
}

<script>
(function () {
  var ORDER = ["Main", "02-SkipCounter", "03-CheckedIn", "04-MessagePharmacist", "05-MessageSent", "06-RunningLow", "07-BuyAgain", "08-Cart", "09-Ready", "10-Done"];
  var params = new URLSearchParams(location.search);
  if (params.get('bare')) document.body.classList.add('bare');

  // Tiny stand-in for the design canvas runtime: renderVals() + setState() + {{holes}}, <sc-for>, <sc-if>.
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (patch) { Object.assign(this.state, patch); render(); };
  DCLogic.prototype.renderVals = function () { return {}; };
  window.DCLogic = DCLogic;

  var classes = {};
  document.querySelectorAll('script[type="text/x-screen"]').forEach(function (s) {
    classes[s.dataset.id] = new Function('DCLogic', s.textContent + '\nreturn Component;')(DCLogic);
  });

  function lookup(scope, path) {
    return path.trim().split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
  }
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function fill(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(scope, p); return v == null ? '' : String(v); });
  }
  function soleHole(str) { var m = str.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m && m[1]; }

  function walk(node, scope) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') > -1) node.nodeValue = fill(node.nodeValue, scope);
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      var list = lookup(scope, soleHole(node.getAttribute('list')) || '') || [];
      var as = node.getAttribute('as');
      var frag = document.createDocumentFragment();
      list.forEach(function (item) {
        var s = Object.create(scope); s[as] = item;
        Array.prototype.forEach.call(node.childNodes, function (c) {
          var copy = c.cloneNode(true); frag.appendChild(copy); walk(copy, s);
        });
      });
      node.replaceWith(frag);
      return;
    }
    if (tag === 'sc-if') {
      var keep = !!lookup(scope, soleHole(node.getAttribute('value')) || '');
      var kids = Array.prototype.slice.call(node.childNodes);
      if (keep) { node.replaceWith.apply(node, kids); kids.forEach(function (k) { walk(k, scope); }); }
      else node.remove();
      return;
    }
    Array.prototype.slice.call(node.attributes).forEach(function (a) {
      if (a.name.indexOf('on') === 0) {
        var fn = lookup(scope, soleHole(a.value) || '');
        node.removeAttribute(a.name);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
      } else if (a.value.indexOf('{{') > -1) {
        node.setAttribute(a.name, fill(a.value, scope));
      }
    });
    if (tag === 'a') {
      var href = node.getAttribute('href') || '';
      if (/\.dc\.html$/.test(href)) node.setAttribute('href', '#' + href.replace('.dc.html', ''));
    }
    Array.prototype.slice.call(node.childNodes).forEach(function (c) { walk(c, scope); });
  }

  var screenEl = document.getElementById('screen');
  var current = null, instance = null;

  function render() {
    var keep = [];
    screenEl.querySelectorAll('*').forEach(function (el, i) { if (el.scrollTop) keep.push([i, el.scrollTop]); });
    var tpl = document.getElementById('t-' + current);
    var frag = tpl.content.cloneNode(true);
    var holder = document.createElement('div');
    holder.appendChild(frag);
    walk(holder, instance.renderVals());
    screenEl.replaceChildren.apply(screenEl, Array.prototype.slice.call(holder.childNodes));
    var all = screenEl.querySelectorAll('*');
    keep.forEach(function (k) { if (all[k[0]]) all[k[0]].scrollTop = k[1]; });
  }

  function show(id) {
    if (ORDER.indexOf(id) < 0) id = ORDER[0];
    current = id;
    instance = new classes[id]({});
    render();
    document.title = document.getElementById('t-' + id).dataset.title + ' · CVS Iteration 1';
    jump.value = id;
  }

  var jump = document.getElementById('jump');
  ORDER.forEach(function (id) {
    var o = document.createElement('option');
    o.value = id; o.textContent = document.getElementById('t-' + id).dataset.title;
    jump.appendChild(o);
  });
  jump.addEventListener('change', function () { location.hash = jump.value; });
  document.getElementById('restart').addEventListener('click', function () { location.hash = ORDER[0]; });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

  function fit() {
    var dev = document.getElementById('device');
    var s;
    if (document.body.classList.contains('bare')) s = 1;
    else if (window.innerWidth <= 520) s = window.innerWidth / 402;
    else s = Math.min(1, (window.innerHeight - 110) / 874, (window.innerWidth - 40) / 402);
    screenEl.style.transform = 'scale(' + s + ')';
    dev.style.width = 402 * s + 'px';
    dev.style.height = 874 * s + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  show(location.hash.slice(1));
})();
</script>
